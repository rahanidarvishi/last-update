# Nginx reverse-proxy config for the Darvishi CRM — see SECURITY.md section 4.
# Copy to /etc/nginx/sites-available/darvishi, replace your-domain.com, then:
#   sudo ln -s /etc/nginx/sites-available/darvishi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl restart nginx
#   sudo certbot --nginx -d your-domain.com   (adds the HTTPS server block automatically)

server {
    listen 80;
    server_name your-domain.com;

    # Security headers (requested checklist item 4)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS is added below in the HTTPS block only — sending it over plain HTTP has no effect
    # and Certbot will add its own HTTPS server block with these headers copied in.

    client_max_body_size 3M; # matches the app's own JSON body limit with a little headroom

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No location block for /data or similar is defined on purpose — the data
    # directory is never exposed by Nginx, only reachable by the Node process
    # itself on the local filesystem.
}

# After running certbot, its generated HTTPS server block will listen on 443,
# terminate TLS, and proxy the same way. Add these two lines inside that
# server block (certbot won't add them automatically) to satisfy checklist
# item 4's HSTS + TLS version requirements:
#
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#   ssl_protocols TLSv1.2 TLSv1.3;
