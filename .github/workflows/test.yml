name: Tests

# Runs the project's test suite automatically:
#  - on every push to any branch
#  - on every pull request
# If npm test fails, the commit gets a red ❌ on GitHub so you see the
# problem before ever touching the VPS.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
