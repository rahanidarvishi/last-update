<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | سیستم مدیریت رزرواسیون و تامین خارجی آژانس مجلل درویشی</title>
<link rel="stylesheet" href="/vendor/vazirmatn.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <button type="button" id="planeLogoBtn" class="plane-logo-btn" title="کلیک کن ✈️" aria-label="لوگو — کلیک کن">
      <svg class="plane-logo-icon" id="planeLogoIcon" viewBox="0 0 24 24" width="26" height="26" fill="#fff" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/>
      </svg>
    </button>
    <h1>سیستم مدیریت رزرواسیون و تامین خارجی آژانس مجلل درویشی</h1>
    <div class="sub">لطفاً برای ورود، نام کاربری و رمز عبور خود را وارد کنید</div>
    <form id="loginForm">
      <label>نام کاربری<input type="text" id="username" autocomplete="username" required></label>
      <label>رمز عبور<input type="password" id="password" autocomplete="current-password" required></label>
      <label>کد امنیتی
        <div class="captcha-row">
          <div class="captcha-question" id="captchaQuestion">…</div>
          <input type="text" id="captchaInput" inputmode="numeric" placeholder="پاسخ" required style="flex:1;">
          <button type="button" class="captcha-refresh" id="captchaRefresh" title="کد جدید">↻</button>
        </div>
      </label>
      <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;margin-top:8px;">ورود</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
